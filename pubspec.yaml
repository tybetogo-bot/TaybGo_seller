name: teybatseller
description: "TybeToGo Vendor App - Restaurant management and order handling"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^7.0.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.1

  # Network & API
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # Utilities
  intl: any
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.4.2
  logger: ^2.4.0
  url_launcher: ^6.3.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Image handling
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  image: ^4.1.7

  # QR/Barcode Scanner
  mobile_scanner: ^7.1.4

  # OCR / Text Recognition
  google_mlkit_text_recognition: ^0.11.0
  permission_handler: ^11.3.1

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Connectivity
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.9.0
  freezed: ^3.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/logo.jpg"
  image_path: "assets/icons/logo.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
