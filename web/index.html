<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TaybGo Seller - Restaurant Management App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TaybGo Seller">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TaybGo Seller</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase is initialized by Flutter's firebase_core package -->
</head>
<body>
  <!-- Loading screen shown while Flutter initializes -->
  <style>
    body {
      margin: 0;
      background: #FAFAFA;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading svg {
      width: 200px;
      height: auto;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #E8F5E9;
      border-top-color: #2E7D32;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    window.flutterfire_web_sdk_version = '11.9.1';
    window.flutterfire_ignore_scripts = ['core', 'messaging'];
    window.__flutterFirebaseReady = Promise.resolve();
  </script>
  <script type="module">
    window.__flutterFirebaseReady = Promise.all([
      import('/firebasejs/11.9.1/firebase-app.js'),
      import('/firebasejs/11.9.1/firebase-messaging.js'),
    ]).then(function (modules) {
      window.firebase_core = modules[0];
      window.firebase_messaging = modules[1];
    });
  </script>

  <div id="loading">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <text x="512" y="540" text-anchor="middle" dominant-baseline="middle"
            font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
            font-size="260" font-weight="700" fill="#2E7D32"
            letter-spacing="-8">TaybGo</text>
    </svg>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 300);
      }
    });
  </script>
  <script>
    window.__flutterFirebaseReady
      .catch(function (error) {
        console.error('Failed to preload Firebase web SDK locally', error);
        window.flutterfire_ignore_scripts = [];
      })
      .finally(function () {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
